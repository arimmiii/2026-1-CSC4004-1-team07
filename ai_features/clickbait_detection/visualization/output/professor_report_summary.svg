<text x="90" y="615" font-size="20" fill="#181714" font-family="Arial, Helvetica, sans-serif">1. KLUE RoBERTa base remains the strongest</text>
<text x="90" y="643" font-size="20" fill="#181714" font-family="Arial, Helvetica, sans-serif">final model.</text>
<text x="90" y="681" font-size="20" fill="#181714" font-family="Arial, Helvetica, sans-serif">2. DeBERTa base is competitive, but still</text>
<text x="90" y="709" font-size="20" fill="#181714" font-family="Arial, Helvetica, sans-serif">below the KLUE model.</text>
<text x="90" y="747" font-size="20" fill="#181714" font-family="Arial, Helvetica, sans-serif">3. Linear models remain useful low-cost</text>
<text x="90" y="775" font-size="20" fill="#181714" font-family="Arial, Helvetica, sans-serif">baselines.</text>
<text x="90" y="813" font-size="18" fill="#635b52" font-family="Arial, Helvetica, sans-serif">Only the final shared-split rerun is used as</text>
<text x="90" y="837" font-size="18" fill="#635b52" font-family="Arial, Helvetica, sans-serif">the official transformer score.</text>
