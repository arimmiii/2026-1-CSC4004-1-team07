<text x="860" y="696" font-size="18" fill="#c27b2f" font-family="Arial, Helvetica, sans-serif">+0.0027 vs baseline</text>
<rect x="90" y="810" width="1620" height="92" rx="18" fill="#1f1b17"/>
<text x="120" y="862" font-size="28" font-weight="700" fill="#fffaf3" font-family="Arial, Helvetica, sans-serif">Summary</text>
<text x="330" y="852" font-size="20" fill="#fffaf3" font-family="Arial, Helvetica, sans-serif">Run A improved over the original baseline by lowering the learning rate from 2e-5 to 1e-5 while keeping epochs and max_length fixed.</text>
<text x="330" y="880" font-size="18" fill="#dfd2c3" font-family="Arial, Helvetica, sans-serif">Run B added one more epoch at the original learning rate, but its gain stayed below Run A.</text>
