<text x="120" y="306" font-size="18" fill="#6e6257" font-family="Arial, Helvetica, sans-serif">lr 2e-5 / epochs 2 / max_length 128</text>
<text x="120" y="334" font-size="18" fill="#6e6257" font-family="Arial, Helvetica, sans-serif">Valid F1 0.8007 / Test F1 0.8028</text>
<text x="120" y="362" font-size="18" fill="#6e6257" font-family="Arial, Helvetica, sans-serif">Original final rerun used in the previous report.</text>
<rect x="860" y="260" width="700" height="40" rx="20" fill="#fbf8f2"/>
