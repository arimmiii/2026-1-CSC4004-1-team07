<text x="860" y="336" font-size="18" fill="#1f6f78" font-family="Arial, Helvetica, sans-serif">baseline</text>
<text x="120" y="456" font-size="28" font-weight="700" fill="#1f1b17" font-family="Arial, Helvetica, sans-serif">Run A</text>
<text x="120" y="486" font-size="18" fill="#6e6257" font-family="Arial, Helvetica, sans-serif">lr 1e-5 / epochs 2 / max_length 128</text>
<text x="120" y="514" font-size="18" fill="#6e6257" font-family="Arial, Helvetica, sans-serif">Valid F1 0.8126 / Test F1 0.8145</text>
<text x="120" y="542" font-size="18" fill="#6e6257" font-family="Arial, Helvetica, sans-serif">Best result so far. Lower learning rate improved stability.</text>
