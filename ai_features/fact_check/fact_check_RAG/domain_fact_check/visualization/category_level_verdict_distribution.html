<!doctype html><html lang="ko"><head><meta charset="utf-8" /><title>Category-Level Verdict Distribution</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; color: #111; }
    h1, h2 { margin: 0 0 12px; }
    .note { color: #444; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
    .bar-row { margin: 12px 0; }
    .label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
    .bar { background: #eef1f5; border-radius: 6px; overflow: hidden; height: 24px; }
    .fill { height: 100%; color: white; font-size: 12px; line-height: 24px; padding-left: 8px; box-sizing: border-box; white-space: nowrap; }
    .green { background: #16a34a; }
    .red { background: #dc2626; }
    .amber { background: #d97706; }
    .slate { background: #475569; }
    .blue { background: #2563eb; }
    .purple { background: #7c3aed; }
    .teal { background: #0f766e; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #ddd; padding: 8px 10px; text-align: left; font-size: 14px; }
    th { background: #f8fafc; }
    code { background: #f4f4f5; padding: 2px 4px; border-radius: 4px; }
  </style>
</head><body>
<h1>Category-Level Verdict Distribution</h1>
<div class="note">기사 단위 대표 verdict를 카테고리별로 나눈 표다.</div>
<div class="card">
<table>
  <thead>
    <tr><th>카테고리</th><th>supported</th><th>contradicted</th><th>misleading</th><th>unverified</th><th>no_external_verdict</th></tr>
  </thead>
  <tbody>
    <tr><td>IT/과학</td><td>1</td><td>0</td><td>2</td><td>0</td><td>0</td></tr>
    <tr><td>경제</td><td>4</td><td>4</td><td>2</td><td>0</td><td>0</td></tr>
    <tr><td>사회</td><td>7</td><td>6</td><td>3</td><td>3</td><td>1</td></tr>
    <tr><td>생활/문화</td><td>3</td><td>0</td><td>0</td><td>1</td><td>1</td></tr>
  </tbody>
</table>
</div>
<div class="card">
  <h2>해석</h2>
  <div class="note">이 표로 분야별 경향을 설명할 수 있다. 예를 들어 사회는 분포가 고르게 섞여 있고, 경제는 contradicted가 상대적으로 많이 나온다.</div>
</div>
</body></html>
